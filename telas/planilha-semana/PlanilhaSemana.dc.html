<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Planilha da semana" description="O ciclo como planilha: semanas nas linhas, dias nas colunas, treinos arrastáveis e entrada por atalho." -->
<helmet><script src="./ds-base.js"></script><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{background:var(--bg-app);font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-primary);line-height:var(--leading-body)}a{color:var(--primary);text-decoration:none}a:hover{color:var(--primary-dark);text-decoration:underline}</style></helmet>
<div style="min-height:100vh;background:var(--bg-app)">
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.AppHeader" hint-size="100%,84px" title="Treinador Mateus Lucas" actions="{{ headerActions }}"></x-import>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Breadcrumb" hint-size="100%,40px" items="{{ crumbs }}"></x-import>
<div style="max-width:var(--max-width-desktop);margin:0 auto;padding:var(--padding-desktop)">
<div style="margin-bottom:20px"><x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.WeekNav" hint-size="100%,72px" label="03/08/2026 até 09/08/2026" sub="Semana 1 de 8 · Ciclo 21km · Período Base" actions="{{ weekActions }}"></x-import></div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px">
<div>
<h1 style="margin:0;font-size:1.6rem;font-weight:var(--weight-bold);letter-spacing:-0.6px;line-height:1.15">Planilha do ciclo</h1>
<p style="margin:6px 0 0;font-size:var(--text-13-5);color:var(--text-secondary)">{{ resumoCiclo }}</p>
</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<a href="../biblioteca-treinos/BibliotecaTreinos.dc.html" style="text-decoration:none"><x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Button" hint-size="130px,38px" variant="ghost">Biblioteca</x-import></a>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Button" hint-size="140px,38px" variant="ghost">Salvar template</x-import>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Button" hint-size="132px,38px">Nova semana</x-import>
</div>
</div>
<div style="margin-bottom:20px"><x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Card" hint-size="100%,150px" padding="1.25rem 1.5rem">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px">
<h2 style="margin:0;font-size:1rem;font-weight:var(--weight-bold)">Entrada rápida</h2>
<span style="font-size:var(--text-12);color:var(--text-secondary)">Digite o treino e pressione Enter · a duração vem das zonas do atleta</span>
</div>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.QuickAdd" hint-size="100%,88px" zones="{{ zones }}" placeholder="8k z2 · 6x800 z4 int 2min · longao 16k z2" onAdd="{{ onAdd }}"></x-import>
<sc-if value="{{ temRascunho }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border:1.5px solid var(--primary);border-radius:var(--radius-md);background:var(--primary-light)">
<span style="font-size:var(--text-11);font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow-wide);color:var(--primary)">Rascunho</span>
<span style="flex:1;min-width:0;font-size:var(--text-13-5);color:var(--text-primary)">{{ rascunho }}</span>
<span style="font-size:var(--text-12);color:var(--text-secondary)">arraste para um dia da planilha</span>
</div>
</sc-if>
</x-import></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px">
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.StatItem" hint-size="100%,96px" label="Volume do ciclo" value="{{ volumeCiclo }}"></x-import>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.StatItem" hint-size="100%,96px" label="Treinos escritos" value="{{ totalTreinos }}"></x-import>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.StatItem" hint-size="100%,96px" label="Semanas vazias" value="{{ vaziasCount }}" tone="warning"></x-import>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.StatItem" hint-size="100%,96px" label="Maior salto de volume" value="{{ maiorSalto }}" tone="warning"></x-import>
</div>
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Card" hint-size="100%,520px" padding="1.5rem">
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.SectionHeader" hint-size="100%,52px" title="Semanas" subtitle="Arraste um treino entre dias · clique num vazio para adicionar"></x-import>
<div style="overflow-x:auto">
<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.CycleGrid" hint-size="100%,420px" weeks="{{ semanas }}"></x-import>
</div>
</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;testePace&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;05:00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Atleta&quot;}}">
class Component extends DCLogic {
  state = { rascunho: null };
  renderVals(){
    const NS = window.TreinadorMateusLucasDesignSystem_53df72 || {};
    const teste = this.props.testePace ?? '05:00';
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(teste).trim());
    const t = m ? Number(m[1]) * 60 + Number(m[2]) : 300;
    const zones = {
      Z1: { min: t + 60, max: t + 80 }, Z2: { min: t + 40, max: t + 60 },
      Z3: { min: t + 20, max: t + 40 }, Z4: { min: t, max: t + 20 }, Z5: { min: t - 20, max: t }
    };
    const w = (tipo, dist, zona, resumo) => ({ tipo, dist, zona, resumo });
    const semanas = [
      { id: 's1', nome: 'Semana 1', sub: 'Ordinária · Base', fase: 'Base', dias: {
        ter: [w('progressivo', 8, 'Z2', '8 km Z2 progressivo')],
        qui: [w('intervalado', 9.8, 'Z4', '6x800m Z4 int 2min')],
        sab: [w('longao', 16, 'Z2', '16 km Z2 longão')] } },
      { id: 's2', nome: 'Semana 2', sub: 'Recuperação · Base', fase: 'Base', dias: {
        qua: [w('leve', 6, 'Z1', '6 km Z1 regenerativo')] } },
      { id: 's3', nome: 'Semana 3', sub: 'Ordinária · Base', fase: 'Base', dias: {} },
      { id: 's4', nome: 'Semana 4', sub: 'Choque · Base', fase: 'Base', dias: {} },
      { id: 's5', nome: 'Semana 5', sub: 'Ordinária · Específico', fase: 'Específico', dias: {
        ter: [w('ritmado', 10, 'Z3', '10 km Z3 ritmado')],
        qui: [w('repeticoes', 8, 'Z5', '10x400m Z5 int 90s')],
        sab: [w('longao', 18, 'Z2', '18 km Z2 longão')] } },
      { id: 's6', nome: 'Semana 6', sub: 'Ordinária · Específico', fase: 'Específico', dias: {
        ter: [w('fartlek', 9, 'Z4', 'Fartlek 9 km 1min forte/1min leve')],
        sex: [w('longao', 22, 'Z2', '22 km Z2 longão')] } },
      { id: 's7', nome: 'Semana 7', sub: 'Choque · Específico', fase: 'Específico', dias: {
        ter: [w('intervalado', 12, 'Z4', '4x2000m Z4 int 3min')],
        qui: [w('leve', 8, 'Z1', '8 km Z1')],
        sab: [w('longao', 18, 'Z2', '18 km Z2 longão')] } },
      { id: 's8', nome: 'Semana 8', sub: 'Polimento · Prova', fase: 'Polimento', dias: {
        ter: [w('ritmado', 6, 'Z3', '6 km Z3 ritmado')],
        dom: [w('trt', 21.1, 'Z3', 'Meia Maratona da PF')] } }
    ];
    const totais = semanas.map(s => Object.values(s.dias).flat().reduce((a, x) => a + (x.dist || 0), 0));
    const totalTreinos = semanas.reduce((a, s) => a + Object.values(s.dias).flat().length, 0);
    const volumeCiclo = totais.reduce((a, x) => a + x, 0);
    const vazias = totais.filter(x => x === 0).length;
    let salto = 0;
    for (let i = 1; i < totais.length; i++) {
      if (totais[i - 1] > 0 && totais[i] > 0) salto = Math.max(salto, (totais[i] / totais[i - 1] - 1) * 100);
    }
    const glyph = (name) => NS.Icon ? React.createElement(NS.Icon, { name, size: 15 }) : null;
    const bar = (items) => React.createElement('div', { style: { display: 'flex', gap: 8, alignItems: 'center' } }, items);
    const headerActions = NS.IconButton
      ? bar([
          React.createElement('span', { key: 's', style: { fontSize: 12, color: 'rgba(255,255,255,0.7)' } }, 'Salvo agora'),
          React.createElement(NS.IconButton, { key: 'u', tone: 'onDark', title: 'Desfazer', icon: glyph('undo-2') }),
          React.createElement(NS.IconButton, { key: 'r', tone: 'onDark', title: 'Refazer', icon: glyph('redo-2') }),
          React.createElement(NS.IconButton, { key: 't', tone: 'onDark', title: 'Tema escuro', icon: glyph('moon') })])
      : null;
    const weekActions = NS.IconButton
      ? bar([
          React.createElement(NS.IconButton, { key: 'c', title: 'Copiar semana', icon: glyph('copy') }),
          React.createElement(NS.IconButton, { key: 'p', title: 'Imprimir semana', icon: glyph('download') })])
      : null;
    return {
      semanas, zones, headerActions, weekActions, totalTreinos,
      crumbs: ['Atletas', 'Allan e Pedro Henrique', '21km - Maratona Piauí Crono'],
      resumoCiclo: '8 semanas · ' + totalTreinos + ' treinos · Base e Específico',
      volumeCiclo: volumeCiclo.toFixed(1) + ' km',
      vaziasCount: String(vazias),
      maiorSalto: '+' + Math.round(salto) + '%',
      temRascunho: !!this.state.rascunho,
      rascunho: this.state.rascunho || '',
      onAdd: (parsed, raw) => this.setState({
        rascunho: (parsed && parsed.resumo ? parsed.resumo : raw) +
          (parsed && parsed.minTxt ? ' · ' + parsed.minTxt + ' a ' + parsed.maxTxt : '')
      })
    };
  }
}
</script>
</body>
</html>
