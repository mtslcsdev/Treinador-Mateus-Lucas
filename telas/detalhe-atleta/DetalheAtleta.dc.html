<div style="margin-bottom:24px"><x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.Card" hint-size="100%,300px" variant="navy" padding="1.5rem">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px">

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start">

<x-import component-from-global-scope="TreinadorMateusLucasDesignSystem_53df72.SectionHeader" hint-size="100%,52px" title="Ciclos" subtitle="2 ciclos · 26 treinos"></x-import>

<sc-if value="{{ showHistorico }}" hint-placeholder-val="{{ true }}">

<div style="display:grid;grid-template-columns:auto 1fr auto;column-gap:0;align-items:center">
<div style="font-size:var(--text-11);font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow-wide);color:var(--text-muted);padding:0 16px 8px 0">Data</div>
<div style="font-size:var(--text-11);font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow-wide);color:var(--text-muted);padding:0 16px 8px 0">Pace</div>
<div style="font-size:var(--text-11);font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow-wide);color:var(--text-muted);padding:0 0 8px;text-align:right">Variação</div>
<sc-for list="{{ testes }}" as="t" hint-placeholder-count="4">
<div style="font-size:var(--text-13-5);color:var(--text-secondary);padding:9px 16px 9px 0;border-top:1px solid var(--border)">{{ t.data }}</div>
<div style="font-family:var(--font-mono);font-size:var(--text-base);font-weight:var(--weight-semibold);letter-spacing:1px;padding:9px 16px 9px 0;border-top:1px solid var(--border)">{{ t.pace }}</div>
<div style="font-size:var(--text-13-5);font-weight:var(--weight-semibold);text-align:right;padding:9px 0;border-top:1px solid var(--border)">{{ t.delta }}</div>
</sc-for>
</div>

</sc-if>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;testePace&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;05:00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Atleta&quot;},&quot;showHistorico&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  state = { teste: null };
  renderVals(){
    const NS = window.TreinadorMateusLucasDesignSystem_53df72 || {};
    const teste = this.state.teste ?? this.props.testePace ?? '05:00';
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(teste).trim());
    const t = m ? Number(m[1]) * 60 + Number(m[2]) : 300;
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (s) => pad(Math.floor(s / 60)) + ':' + pad(Math.round(s) % 60);
    const zone = (min, max) => ({
      pace: fmt(min) + ' a ' + fmt(max) + '/km',
      vel: (3600 / max).toFixed(2) + ' a ' + (3600 / min).toFixed(2) + ' km/h'
    });
    const glyph = (name) => NS.Icon ? React.createElement(NS.Icon, { name, size: 15 }) : null;
    const headerActions = NS.IconButton
      ? React.createElement('div', { style: { display: 'flex', gap: 8, alignItems: 'center' } },
          React.createElement('span', { key: 's', style: { fontSize: 12, color: 'rgba(255,255,255,0.7)' } }, 'Salvo agora'),
          React.createElement(NS.IconButton, { key: 'u', tone: 'onDark', title: 'Desfazer', icon: glyph('undo-2') }),
          React.createElement(NS.IconButton, { key: 'r', tone: 'onDark', title: 'Refazer', icon: glyph('redo-2') }),
          React.createElement(NS.IconButton, { key: 't', tone: 'onDark', title: 'Tema escuro', icon: glyph('moon') }))
      : null;
    return {
      z1: zone(t + 60, t + 80), z2: zone(t + 40, t + 60), z3: zone(t + 20, t + 40),
      z4: zone(t, t + 20), z5: zone(t - 20, t),
      headerActions,
      crumbs: ['Atletas', 'Allan e Pedro Henrique'],
      testeValue: String(teste),
      onTeste: (e) => this.setState({ teste: e.target.value }),
      volume: [
        { label: 'S1', value: 33.8 }, { label: 'S2', value: 6 }, { label: 'S3', value: 0 }, { label: 'S4', value: 0 },
        { label: 'S5', value: 28 }, { label: 'S6', value: 31 }, { label: 'S7', value: 38 }, { label: 'S8', value: 32 }
      ],
      testes: [
        { data: '02/08/2026', pace: '05:00/km', delta: '−6 s/km' },
        { data: '14/06/2026', pace: '05:06/km', delta: '−4 s/km' },
        { data: '26/04/2026', pace: '05:10/km', delta: '−12 s/km' },
        { data: '01/03/2026', pace: '05:22/km', delta: 'primeiro teste' }
      ],
      showHistorico: this.props.showHistorico ?? true
    };
  }
}
</script>
